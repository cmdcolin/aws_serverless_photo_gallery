AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: S3 Uploader

Parameters:
  SecretPassword:
    Type: String
    Default: password
    NoEcho: true
    Description: Password callers must supply to upload files or post comments

Globals:
  Function:
    # every function ships the same bundle and picks its entry point with the
    # Handler below, so the lib/ helpers only exist once
    CodeUri: lambdas/
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        FilesTable: !Ref filesDynamoDBTable
        GuestbookTable: !Ref guestbookDynamoDBTable

Resources:
  filesDynamoDBTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: files
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: filename
          AttributeType: S
      KeySchema:
        - AttributeName: filename
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  guestbookDynamoDBTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: guestbook
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: timestamp
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  MyApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*'
        AllowOrigins:
          - '*'

  UploadRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: postDixieFile/app.handler
      Environment:
        Variables:
          UploadBucket: !Ref S3UploadBucket
          Password: !Ref SecretPassword
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref filesDynamoDBTable
        - S3WritePolicy:
            BucketName: !Ref S3UploadBucket
      Events:
        UploadAssetAPI:
          Type: HttpApi
          Properties:
            Path: /postDixieFile
            Method: post
            ApiId: !Ref MyApi

  GuestlistPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: postGuestbookComment/app.handler
      Environment:
        Variables:
          Password: !Ref SecretPassword
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref guestbookDynamoDBTable
      Events:
        UploadAssetAPI:
          Type: HttpApi
          Properties:
            Path: /postGuestbookComment
            Method: post
            ApiId: !Ref MyApi

  GuestlistReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getGuestbookComments/app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref guestbookDynamoDBTable
      Events:
        UploadAssetAPI:
          Type: HttpApi
          Properties:
            Path: /getGuestbookComments
            Method: get
            ApiId: !Ref MyApi

  CommentPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: postDixieComment/app.handler
      Environment:
        Variables:
          Password: !Ref SecretPassword
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref filesDynamoDBTable
      Events:
        UploadAssetAPI:
          Type: HttpApi
          Properties:
            Path: /postDixieComment
            Method: post
            ApiId: !Ref MyApi

  CommentReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getDixieComments/app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref filesDynamoDBTable
      Events:
        UploadAssetAPI:
          Type: HttpApi
          Properties:
            Path: /getDixieComments
            Method: get
            ApiId: !Ref MyApi

  FileReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: getDixieFiles/app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref filesDynamoDBTable
      Events:
        UploadAssetAPI:
          Type: HttpApi
          Properties:
            Path: /getDixieFiles
            Method: get
            ApiId: !Ref MyApi

  ## S3 bucket
  S3UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # S3 disables ACLs on new buckets, so public read comes from the bucket
      # policy below rather than a public-read ACL on each upload
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - '*'

  S3UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3UploadBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${S3UploadBucket.Arn}/*'

## Take a note of the outputs for deploying the workflow templates in this sample application
Outputs:
  APIendpoint:
    Description: HTTP API endpoint URL
    Value: !Sub 'https://${MyApi}.execute-api.${AWS::Region}.amazonaws.com'
  S3UploadBucketName:
    Description: S3 bucket for application uploads
    Value: !Ref S3UploadBucket
